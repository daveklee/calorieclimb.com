[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Edge Functions configuration
[[edge_functions]]
  function = "usda-proxy"
  path = "/api/usda/*"

[[edge_functions]]
  function = "openai-proxy"
  path = "/api/openai"

# Environment variables for build (these will be set in Netlify UI)
# VITE_GA_MEASUREMENT_ID

# API keys for Edge Functions (set these in Netlify UI under Environment Variables)
# USDA_API_KEY
# OPENAI_API_KEY